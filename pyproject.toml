[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestrator"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "anthropic>=0.40",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
orch = "orch.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["orch*"]
